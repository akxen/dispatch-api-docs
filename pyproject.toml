[project]
name = "dispatch-api-docs"
version = "0.1.0"
description = "Documentation site, tutorials and case studies for the NEMDE approximation (https://github.com/akxen/nemde)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
# Builds the site in website/ (cd website && mkdocs serve).
# Don't move to mkdocs 2.0: it breaks mkdocs-material themes and plugins.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]
# Runs the notebooks in tutorials/, case-studies/ and model-validation/,
# and converts them to markdown (website/notebooks_to_markdown.sh).
notebooks = [
    "jupyterlab==4.6.4",
    "nbconvert==7.17.1",
    "pandas==3.0.6",
    "tabulate==0.10.0",
    "numpy==2.5.3",
    "matplotlib==3.11.2",
    "requests==2.34.2",
    "xmltodict==1.0.4",
    "jsonpath-ng==1.8.0",
    "python-dotenv==1.2.3",
]

[tool.uv]
# Not an installable package; uv only manages the environment.
package = false
default-groups = ["docs", "notebooks"]
